<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator by JEYPt</title>

  <style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

   .calculator {
    display: grid;
    grid-template-columns: repeat(4, 50px);
    gap: 10px;
}

input {
    grid-column: 1 / 5;
    width: 100%;
    height: 50px;
    box-sizing: border-box;
}

button {
    width: 50px;
    height: 50px;
    font-size: 20px;
    margin: 0;
}
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" disabled>

    <p>

    <button onclick="
    calculation += '1';
     updateDisplay();
    console.log(calculation);
    ">1</button>
    <button onclick="
    calculation += '4';
     updateDisplay();
    console.log(calculation);
    ">4</button>
    <button onclick="
    calculation += '7';
     updateDisplay();
    console.log(calculation);
    ">7</button>
    <button onclick="
    calculation += '0';
     updateDisplay();
    console.log(calculation);
    ">0</button>
    <button onclick="
    calculation = '';
    updateDisplay();
    console.log(`Calculation was cleared`);
    ">C</button>
  </p>


  <p>

    <button onclick="
    calculation += '2';
     updateDisplay();
    console.log(calculation);
    ">2</button>
    <button onclick="
    calculation += '5';
     updateDisplay();
    console.log(calculation);
    ">5</button>
    <button onclick="
    calculation += '8';
     updateDisplay();
    console.log(calculation);
    ">8</button>
    <button onclick="
    calculation += '.';
     updateDisplay();
    console.log(calculation);
    ">.</button>
    <button onclick="
    calculation = calculation.slice(0, -1);
     updateDisplay();
    console.log(calculation);
    ">X</button>


    </p>

    <p>

    <button onclick="
    calculation += '3';
     updateDisplay();
    console.log(calculation);
    ">3</button>
    <button onclick="
    calculation += '6';
     updateDisplay();
    console.log(calculation);
    ">6</button>
    <button onclick="
    calculation += '9';
     updateDisplay();
    console.log(calculation);
    ">9</button>

    <button onclick="
    try {
        calculation = String(eval(calculation));
        updateDisplay();
        console.log(`Calculation result: ${calculation}`);
    } catch (error) {
        display.value = 'Error';
        calculation = '';
    }
">=</button>

    </p>


    <p>

    <button onclick="
    calculation += ' + ';
     updateDisplay();
    console.log(calculation);
    ">+</button>
    <button onclick="
    calculation += ' - ';
     updateDisplay();
    console.log(calculation);
    ">-</button>
    <button onclick="
    calculation += ' * ';
     updateDisplay();
    console.log(calculation);
    ">*</button>
    <button onclick="
    calculation += ' / ';
     updateDisplay();
    console.log(calculation);
    ">/</button>

    </p>


  
    
    
  
</div>'

<script>
  let calculation = '';

  const display = document.getElementById('display');

  function updateDisplay() {
    display.value = calculation;
  }

</script>
</body>
</html>
